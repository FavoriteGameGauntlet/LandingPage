<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="none"/>
  <g transform="translate(100, 100)">
    <!-- Рамка -->
    <rect x="-90" y="-90" width="180" height="180" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
    <!-- Уголки HUD -->
    <g stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.9">
      <path d="M -85,-75 L -85,-85 L -75,-85"/>
      <path d="M 85,-75 L 85,-85 L 75,-85"/>
      <path d="M -85,75 L -85,85 L -75,85"/>
      <path d="M 85,75 L 85,85 L 75,85"/>
    </g>
    <text x="-80" y="-65" fill="currentColor" font-family="monospace" font-size="10" opacity="0.7">// HEARTS.SYS</text>

    <!-- Масть, масштабированная под 200×200 и сдвинутая ниже лейбла -->
    <g transform="translate(0, 10) scale(0.7)">
      <path d="M 0,80
               C -80,20 -110,-40 -70,-80
               C -45,-105 -15,-95 0,-60
               C 15,-95 45,-105 70,-80
               C 110,-40 80,20 0,80 Z"
            fill="currentColor" stroke="currentColor" stroke-width="2"/>
      <path d="M 0,80
               C -80,20 -110,-40 -70,-80
               C -45,-105 -15,-95 0,-60
               C 15,-95 45,-105 70,-80
               C 110,-40 80,20 0,80 Z"
            fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.9"/>
      <g stroke="currentColor" stroke-width="1" fill="none" opacity="0.8">
        <path d="M -40,-40 L -40,-10 L -20,-10 L -20,20"/>
        <path d="M 40,-40 L 40,-10 L 20,-10 L 20,20"/>
        <path d="M -20,20 L 20,20"/>
        <circle cx="-40" cy="-40" r="3" fill="currentColor"/>
        <circle cx="40" cy="-40" r="3" fill="currentColor"/>
        <circle cx="0" cy="20" r="4" fill="currentColor"/>
        <path d="M 0,20 L 0,50"/>
      </g>
      <rect x="-90" y="-20" width="180" height="3" fill="#ffffff" opacity="0.7"/>
      <rect x="-70" y="-22" width="20" height="1" fill="currentColor"/>
      <rect x="30" y="-19" width="40" height="1" fill="currentColor"/>
    </g>
  </g>
</svg>
