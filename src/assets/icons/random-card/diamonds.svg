<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="none"/>
  <g transform="translate(100, 100)">
    <!-- Рамка -->
    <rect x="-90" y="-90" width="180" height="180" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
    <!-- Уголки HUD -->
    <g stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.9">
      <path d="M -85,-75 L -85,-85 L -75,-85"/>
      <path d="M 85,-75 L 85,-85 L 75,-85"/>
      <path d="M -85,75 L -85,85 L -75,85"/>
      <path d="M 85,75 L 85,85 L 75,85"/>
    </g>
    <text x="-80" y="-65" fill="currentColor" font-family="monospace" font-size="10" opacity="0.7">// DIAMONDS.SYS</text>

    <!-- Масть, масштабированная под 200×200 и сдвинутая ниже лейбла -->
    <g transform="translate(0, 10) scale(0.7)">
      <path d="M 0,-90 L 70,0 L 0,90 L -70,0 Z"
            fill="currentColor" stroke="currentColor" stroke-width="2"/>
      <g stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.7">
        <path d="M 0,-90 L 0,90"/>
        <path d="M -70,0 L 70,0"/>
        <path d="M 0,-60 L 45,0 L 0,60 L -45,0 Z"/>
        <path d="M 0,-30 L 20,0 L 0,30 L -20,0 Z"/>
      </g>
      <g fill="currentColor">
        <rect x="-3" y="-95" width="6" height="6"/>
        <rect x="-3" y="89" width="6" height="6"/>
        <rect x="-95" y="-3" width="6" height="6"/>
        <rect x="89" y="-3" width="6" height="6"/>
      </g>
      <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1"/>
      <text x="0" y="4" fill="currentColor" font-family="monospace" font-size="10" text-anchor="middle">◆</text>
      <g stroke="currentColor" stroke-width="1.5" fill="none">
        <path d="M -75,-5 L -75,-15 L -65,-15"/>
        <path d="M 75,-5 L 75,-15 L 65,-15"/>
        <path d="M -75,5 L -75,15 L -65,15"/>
        <path d="M 75,5 L 75,15 L 65,15"/>
      </g>
    </g>
  </g>
</svg>
