<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="none"/>
  <g transform="translate(100, 100)">
    <!-- Рамка -->
    <rect x="-90" y="-90" width="180" height="180" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
    <!-- Уголки HUD -->
    <g stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.9">
      <path d="M -85,-75 L -85,-85 L -75,-85"/>
      <path d="M 85,-75 L 85,-85 L 75,-85"/>
      <path d="M -85,75 L -85,85 L -75,85"/>
      <path d="M 85,75 L 85,85 L 75,85"/>
    </g>
    <text x="-80" y="-65" fill="currentColor" font-family="monospace" font-size="10" opacity="0.7">// CLUBS.SYS</text>

    <!-- Масть, масштабированная под 200×200 и сдвинутая ниже лейбла -->
    <g transform="translate(0, 10) scale(0.7)">
      <circle cx="0" cy="-45" r="32" fill="currentColor" stroke="currentColor" stroke-width="2"/>
      <circle cx="-40" cy="15" r="32" fill="currentColor" stroke="currentColor" stroke-width="2"/>
      <circle cx="40" cy="15" r="32" fill="currentColor" stroke="currentColor" stroke-width="2"/>
      <path d="M -15,40 L 15,40 L 25,90 L -25,90 Z"
            fill="currentColor" stroke="currentColor" stroke-width="2"/>
      <g stroke="currentColor" stroke-width="1" fill="none" opacity="0.8">
        <circle cx="0" cy="-45" r="20"/>
        <circle cx="0" cy="-45" r="10"/>
        <circle cx="-40" cy="15" r="20"/>
        <circle cx="-40" cy="15" r="10"/>
        <circle cx="40" cy="15" r="20"/>
        <circle cx="40" cy="15" r="10"/>
      </g>
      <circle cx="0" cy="-45" r="3" fill="currentColor"/>
      <circle cx="-40" cy="15" r="3" fill="currentColor"/>
      <circle cx="40" cy="15" r="3" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="0.8" opacity="0.9">
        <line x1="0" y1="-45" x2="-40" y2="15"/>
        <line x1="0" y1="-45" x2="40" y2="15"/>
        <line x1="-40" y1="15" x2="40" y2="15"/>
      </g>
      <g stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.8">
        <line x1="-10" y1="50" x2="-15" y2="85"/>
        <line x1="0" y1="50" x2="0" y2="85"/>
        <line x1="10" y1="50" x2="15" y2="85"/>
      </g>
    </g>
  </g>
</svg>
